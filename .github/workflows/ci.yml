name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node 22 check and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Link CLI
        run: npm link

      - name: Public safety scan
        run: npm run scan:public

      - name: Validate public control pack
        run: ismsp pack validate packs/isms-p-core-v0

      - name: Validate public evidence posture
        run: ismsp evidence validate --public
